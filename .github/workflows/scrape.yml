name: Refresh Events

on:
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 02:00 UTC = 10:00 Taiwan time
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            chromium-browser \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 \
            libpangocairo-1.0-0 libpango-1.0-0 libcairo2 \
            libgtk-3-0 libnss3

      - name: Run all scrapers
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: npm run scrape:all

      - name: Commit and push updated events.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh events $(date -u +'%Y-%m-%d')"
          git push
