name: Refresh Events

on:
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 02:00 UTC = 10:00 Taiwan time
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

env:
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silence Node 20 deprecation warning

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # allow git push back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 (ubuntu-latest) uses libasound2t64 instead of libasound2
      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            chromium-browser \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpangocairo-1.0-0 libpango-1.0-0 libcairo2 \
            libgtk-3-0 libnss3

      # Each scraper runs independently — one failure won't stop the others
      - name: Scrape 國家兩廳院 (NTCH)
        run: npm run scrape:ntch
        continue-on-error: true

      - name: Scrape 衛武營
        run: npm run scrape:weiwuying
        continue-on-error: true

      - name: Scrape 國家歌劇院 (NTT)
        run: npm run scrape:ntt
        continue-on-error: true

      - name: Scrape 台北表演藝術中心 (TPAC)
        run: npm run scrape:tpac
        continue-on-error: true

      - name: Scrape 臺北流行音樂中心 (TMC)
        run: npm run scrape:tmc
        continue-on-error: true

      - name: Scrape Legacy 音樂展演空間
        run: npm run scrape:legacy
        continue-on-error: true

      - name: Scrape OpenTix
        run: npm run scrape:opentix
        continue-on-error: true

      - name: Scrape KKTIX (Puppeteer)
        run: npm run scrape:kktix
        continue-on-error: true

      - name: Scrape 台北市藝文活動通
        run: npm run scrape:cultureexpress
        continue-on-error: true

      - name: Scrape 新竹市文化局
        run: npm run scrape:hsinchu
        continue-on-error: true

      - name: Scrape 新竹縣文化局
        run: npm run scrape:hchcc
        continue-on-error: true

      - name: Scrape 桃園市文化局
        run: npm run scrape:taoyuan
        continue-on-error: true

      - name: Scrape yii.tw
        run: npm run scrape:yii
        continue-on-error: true

      # Always merge whatever data was collected, even if some scrapers failed
      - name: Merge all sources → public/events.json
        run: npm run scrape:merge

      - name: Commit and push updated events.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh events $(date -u +'%Y-%m-%d')"
          git push
